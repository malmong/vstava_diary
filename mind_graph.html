<title>자기관리 내면 — 신경망 그래프</title>
<style>

body { background: #0f1117; overflow: hidden; font-family: 'Noto Sans KR', sans-serif; }
canvas { display: block; }

  vertical-align: middle;
}
#hint {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(255,255,255,0.25);
  font-size: 11px;
  letter-spacing: 0.05em;
  pointer-events: none;
}
</style>
</head>

const edges = [

  ['core','exp',1.5,'#4a7aab'], ['core','trauma',1.5,'#b05a5a'],

// 노드 맵
const nodeMap = {};
nodes.forEach(n => { nodeMap[n.id] = n; });

// 물리 시뮬레이션 초기화
nodes.forEach(n => {
  if (!n.fixed) {
    n.vx = (Math.random()-0.5)*2;
    n.vy = (Math.random()-0.5)*2;
  }
});

let drag = null, mouseX = 0, mouseY = 0, hoveredNode = null;
let offsetX = 0, offsetY = 0;

function dist(a, b) {
  return Math.sqrt((a.x-b.x)**2 + (a.y-b.y)**2);
}

function simulate() {
  const k = 80, repulsion = 6000, damping = 0.85;
  nodes.forEach(n => {
    if (n.fixed || n === drag) return;
    let fx = 0, fy = 0;

    // Repulsion
    nodes.forEach(m => {
      if (m === n) return;
      const dx = n.x - m.x, dy = n.y - m.y;
      const d = Math.max(dist(n, m), 1);
      const f = repulsion / (d * d);
      fx += dx/d * f; fy += dy/d * f;
    });

    // Spring (edges)
    edges.forEach(([a, b]) => {
      if (a !== n.id && b !== n.id) return;
      const other = nodeMap[a === n.id ? b : a];
      const dx = other.x - n.x, dy = other.y - n.y;
      const d = Math.max(dist(n, other), 1);
      const natural = (n.r + other.r) * 3.5;
      const f = (d - natural) * 0.035;
      fx += dx/d * f; fy += dy/d * f;
    });

    // Center gravity
    fx += (W/2 - n.x) * 0.002;
    fy += (H/2 - n.y) * 0.002;

    // Boundary
    const pad = n.r + 20;
    if (n.x < pad) fx += (pad - n.x) * 0.3;
    if (n.x > W - pad) fx += (W - pad - n.x) * 0.3;
    if (n.y < pad) fy += (pad - n.y) * 0.3;
    if (n.y > H - pad) fy += (H - pad - n.y) * 0.3;

    n.vx = (n.vx + fx) * damping;
    n.vy = (n.vy + fy) * damping;
    n.x += n.vx; n.y += n.vy;
  });
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0f1117';
  ctx.fillRect(0, 0, W, H);

  // Edges
  edges.forEach(([a, b, w, color]) => {
    const na = nodeMap[a], nb = nodeMap[b];
    if (!na || !nb) return;
    const isHovered = hoveredNode && (hoveredNode.id === a || hoveredNode.id === b);
    ctx.beginPath();
    ctx.moveTo(na.x, na.y);
    ctx.lineTo(nb.x, nb.y);
    ctx.strokeStyle = isHovered ? color.replace(')', ',0.9)').replace('rgb','rgba') : color + '55';
    ctx.lineWidth = isHovered ? w * 1.8 : w * 0.7;
    ctx.stroke();
  });

  // Nodes
  nodes.forEach(n => {
    const isHov = hoveredNode === n;
    const glow = isHov ? 18 : 0;

    if (isHov) {
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r + glow, 0, Math.PI*2);
      const g = ctx.createRadialGradient(n.x, n.y, n.r, n.x, n.y, n.r + glow);
      g.addColorStop(0, n.color + '44');
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g;
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r, 0, Math.PI*2);
    ctx.fillStyle = isHov ? n.color : n.color + 'cc';
    ctx.fill();
    ctx.strokeStyle = isHov ? '#fff' : n.color + '88';
    ctx.lineWidth = isHov ? 1.5 : 0.6;
    ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.font = `${n.r > 15 ? 12 : 10}px 'Noto Sans KR', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const words = n.label.split(' · ');
    if (words.length > 1 && n.r > 13) {
      ctx.fillText(words[0], n.x, n.y - 6);
      ctx.fillText(words[1], n.x, n.y + 7);
    } else {
      ctx.fillText(n.label, n.x, n.y);
    }
  });
}

function getNode(x, y) {
  return nodes.find(n => dist(n, {x, y}) <= n.r + 4) || null;
}

canvas.addEventListener('mousemove', e => {
  mouseX = e.clientX; mouseY = e.clientY;
  if (drag) {
    drag.x = e.clientX + offsetX;
    drag.y = e.clientY + offsetY;
    return;
  }
  const n = getNode(e.clientX, e.clientY);
  hoveredNode = n;
  if (n) {
    canvas.style.cursor = 'pointer';
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX + 16) + 'px';
    tooltip.style.top = (e.clientY - 10) + 'px';
    tooltip.querySelector('.tt-title').textContent = n.label;
    tooltip.querySelector('.tt-body').textContent = n.desc;
  } else {
    canvas.style.cursor = 'default';
    tooltip.style.display = 'none';
  }
});

canvas.addEventListener('mousedown', e => {
  const n = getNode(e.clientX, e.clientY);
  if (n) { drag = n; offsetX = n.x - e.clientX; offsetY = n.y - e.clientY; }
});

canvas.addEventListener('mouseup', () => { drag = null; });
canvas.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; hoveredNode = null; });

window.addEventListener('resize', () => {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W; canvas.height = H;
  nodeMap['core'].x = W/2; nodeMap['core'].y = H/2;
});

function loop() {
  simulate();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
